<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title if title else "Flask + Materialize" }}</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        /* Topbar fissa */
        nav.topbar {
            position: fixed;
            top: 0;
            height: 64px;
            left: 0;
            right: 0;
            z-index: 2000;
        }

        /* Sidebar sotto la topbar */
        .sidebar {
            width: 250px;
            margin: 0px;
            position: fixed;
            top: 64px; /* altezza navbar */
            left: 0;
            bottom: 0;
            background: #1565c0;
            padding-top: 20px;
            overflow-y: auto;
        }

        .sidebar a {
            display: block;
            padding: 15px 25px;
            color: white !important;
            font-size: 16px;
        }

        .sidebar a:hover {
            background: rgba(255,255,255,0.15);
        }

        .dropdown-content li > a {
            color: black !important;
        }

        /* Contenuto che parte sotto la topbar e accanto alla sidebar */
        main {
            margin-top: 80px;      /* sotto topbar */
            margin-left: 270px;    /* spazio sidebar */
            padding: 2rem;
        }
    </style>
</head>

<body>

    <!-- TOPBAR -->
    <nav class="blue darken-3 topbar">
        <div class="nav-wrapper" style="padding-left: 20px;">
            <span class="brand-logo">LIGHTBROKER</span>
        </div>
    </nav>

    <!-- SIDEBAR (sotto la topbar) -->
    <ul class="sidebar">
        <li><a href="#"><i class="material-icons left">dashboard</i> Dashboard</a></li>
        <li><a href="#"><i class="material-icons left">people</i> Utenti</a></li>
        <li><a href="#"><i class="material-icons left">settings</i> Impostazioni</a></li>
        <li><a href="#"><i class="material-icons left">bar_chart</i> Statistiche</a></li>

        <li>
            <a class="dropdown-trigger" href="#" data-target="submenu-dropdown">
                <i class="material-icons left">more_vert</i> Altro ▾
            </a>
        </li>
    </ul>

    <!-- MENU DROPDOWN -->
    <ul id="submenu-dropdown" class="dropdown-content">
        <li><a href="#">Opzione 1</a></li>
        <li><a href="#">Opzione 2</a></li>
        <li><a href="#">Opzione 3</a></li>
    </ul>

    <!-- CONTENUTO -->
    <main>

        <!-- CARDS DASHBOARD -->
        <div class="row">
            <div class="col s12 m6 l3">
                <div class="card blue">
                    <div class="card-content white-text">
                        <span class="card-title">Channels</span>
                        <h4 class="lb-channels-counter">..</h4>
                    </div>
                </div>
            </div>

            <div class="col s12 m6 l3">
                <div class="card teal">
                    <div class="card-content white-text">
                        <span class="card-title">Ordini</span>
                        <h4>87</h4>
                    </div>
                </div>
            </div>

            <div class="col s12 m6 l3">
                <div class="card deep-purple">
                    <div class="card-content white-text">
                        <span class="card-title">Tickets</span>
                        <h4>34</h4>
                    </div>
                </div>
            </div>

            <div class="col s12 m6 l3">
                <div class="card orange darken-2">
                    <div class="card-content white-text">
                        <span class="card-title">Ricavi</span>
                        <h4>€12.4k</h4>
                    </div>
                </div>
            </div>
        </div>

        {% block content %}
        {% endblock %}

    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            M.Dropdown.init(document.querySelectorAll('.dropdown-trigger'), {
                hover: true,
                coverTrigger: false,
                alignment: 'left'
            });
        });
        fetch('http://localhost:5555/broker/api/channels')
        .then(res => res.json())
        .then(data => {
            let total = 0;
            for (let e in data.channels){
                total += Object.keys(data.channels[e]).length
            }
            document.querySelectorAll('.lb-channels-counter')[0].innerHTML = total
        });
    </script>

</body>
</html>
